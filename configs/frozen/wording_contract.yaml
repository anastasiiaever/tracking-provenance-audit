# Frozen protocol constants, transcribed from
# provenance/frozen_records/02_PROSPECTIVE_PROTOCOL.json (frozen 2026-08-30).
# These values are READ, never tuned. Editing this file does not make the audit
# agree with the released results; it makes it disagree.

applies_to: every SECONDARY_SPLIT_ADAPTED cell
required: State that the repository's documented TEST-set post-processing rule was applied unchanged to
  a pre-specified validation population.
forbidden: Do not state or imply that the repository documents post-processing use on the validation split
  for these cells.
correction_note: This corrects over-broad wording that appeared in frozen V8 ('under their documented
  post-processing rules' applied to a validation population). V8 is NOT edited; the correction binds V9
  language only.
exempt: PRIMARY_DOCUMENTED_VALIDATION cells (Deep-OC-SORT; StrongSORT++ MOT17) may state that validation
  use is documented, because it is.
counting_units:
  deployment_definition: one released tracker/pipeline configuration and its audited post-processing call
  family_definition: implementation lineage / structural operator family
  deployments_in_universe: 8
  independent_families: 3
  families:
    LINEAR_DTI_ROW_ADDITIVE:
    - ByteTrack
    - BoT-SORT
    - OC-SORT
    - Deep-OC-SORT
    - Hybrid-SORT
    - SparseTrack
    GPR_REWRITE:
    - OC-SORT-GPR
    LINK_PLUS_SMOOTHING:
    - StrongSORT++
  lineage_groups:
    L: ByteTrack-derived dti; six deployments; 100% identical normalized token stream for ByteTrack/OC-SORT/Hybrid-SORT/SparseTrack,
      BoT-SORT +1 print, Deep-OC-SORT n_min default 25->30
    G: OC-SORT gp_interpolation.py, independent
    S: StrongSORT GSI.py + AFLink, independent
  reporting_rule: Every future table must state BOTH deployment count and independent family count. Repository
    count is never family count.
interpretation_contract:
  HISTORICAL_OUTCOME_KNOWN_PRE_V9: may be replayed through the V9 CLI as implementation validation and
    as part of the systematic universe, but MUST NOT be described as a prospective V9 result
  PROSPECTIVE_OUTCOME_UNSEEN_AT_V9_FREEZE: may receive prospective interpretation only if all protocol
    and executable conditions were frozen before execution
  NO_QUANTITATIVE_OUTCOME_PLANNED: documentation / no-rule cells only
  STOPPED_UNSEEN: outcome remains unseen because execution is stopped (e.g. corpus not acquired)
  reporting_requirement: The paper must report how many EXECUTED cells were historical versus genuinely
    prospective. A blanket statement that all outcomes were prospectively frozen is FORBIDDEN.
