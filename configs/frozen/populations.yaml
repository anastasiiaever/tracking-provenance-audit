MOT17:
  status: FROZEN_AND_MATERIALISED
  source_split: MOT17 train (labelled), FRCNN detector copy only
  detector_copy_rule: MOT17 ships DPM/FRCNN/SDP copies of each base sequence with byte-identical ground
    truth; exactly one copy (FRCNN) is used so the seven base sequences are counted once.
  frame_range_rule: 'Verbatim from ByteTrack tools/convert_mot17_to_coco.py:57-58 and reproduced identically
    in Deep-OC-SORT data/tools/convert_mot17_to_coco.py:57-58: image_range = [num_images//2 + 1, num_images
    - 1] over 0-indexed images; image i maps to 1-indexed frame i+1, so the retained native frame range
    is [num//2 + 2, num].'
  frame_index_convention: 1-indexed; rebased to 1..val_half_length by subtracting rebase_offset = num//2
    + 1
  total_val_half_frames: 2652
  gt_source: MOT17 train gt/gt_val_half.txt emitted by the frozen converter; per-sequence sha256 above
  ignore_crowd_semantics: MOTChallenge gt column 7 (flag) must equal 1; class column 8 must equal 1 (pedestrian).
    Classes {3,4,5,6,9,10,11} are non-person and dropped; classes {2,7,8,12} are ignore-person regions
    and are neither scored nor counted as reference identities. Visibility (column 9) is NOT thresholded.
  evaluator_configuration: TrackEval MOT17 val_half; identical config for every comparable pipeline
  population_manifest_hash_spec: sha256 over the sorted concatenation of per-sequence (sequence, native_frames_retained,
    rebase_offset, val_half_length, gt_sha256) records
  shared_by: All quantitatively comparable MOT17 deployments use THIS population. Deep-OC-SORT's documented
    MOT17-val is the same second-half split (identical converter rule), so no pipeline selects its own
    population.
