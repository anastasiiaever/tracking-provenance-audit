# Environment for the offline verification, the tests and the minimal example.
#
#   conda env create -f environment.yml
#   conda activate tracking-provenance-audit
#   python scripts/verify_release.py
#
# Python 3.9 is the hard minimum: the audit core uses PEP 584 dict union.
# Versions below are the ones the reported results were produced under.
#
# This environment does NOT include the GPU stack needed to re-run a tracker
# (level 3 in docs/REPRODUCIBILITY.md). That path additionally needs
# torch 1.13.1+cu117, torchvision 0.14.1+cu117 and CUDA 11.7, plus each upstream
# tracker's own environment.
name: tracking-provenance-audit
channels:
  - conda-forge
dependencies:
  - python=3.9
  - numpy=1.23.5
  - scipy=1.10.1
  - pyyaml
  - pytest
